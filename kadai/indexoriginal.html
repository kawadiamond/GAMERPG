<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>myMemoPad</title>
<script src="js/jquery-2.1.3.min.js"></script>
<link rel="stylesheet" href="css/sample.css">
</head>
<body>
<header>
<h1>GAME RPG</h1>
</header>
<main>
    <div class="btn-area">
        <button id="start" class="btn btn-start">GAME START</button>
    </div>
    <div id="enemy"></div>
    <div id="comment"></div>
    <div id="palyer" class="btn-area btn-row">
        <button id="attack" class="btn btn-attack">ATTACK</button>
    </div>
    <input type="text" id="key">
    <textarea id="memo"></textarea>
    <ul>
        <li id="save">Save</li>
        <li id="clear">Clear</li>
    </ul>
</main>
<table id="list">
<!-- ここに追加データが挿入される -->
 <tr><td></td><td></td></tr>
</table>
<script>

//関数定義
let enemyName =""; 
let enemyHP = 1;

//ゲームスタート
let playing = 0 ;
$("#start").on("click",function(){
    alert("start");
    playingGame();
    loadData();
});

// playGame 関数定義
function playingGame(){

//初期化
enemyName =""; 
enemyHP = 1;


//アルファベット
const source = ["a","b","c","d","e","f","g","h","i","j","k","l","m","n","o","p","q","r","s","t","u","z"];


//敵文字の決定
let letterCount = Math.floor(Math.random()*22)+1;
console.log("文字数:"+letterCount);

//敵文字配列決定+HP決定

for(let i = 0 ; i<letterCount ;i++){
   let letternumber =Math.floor(Math.random()*22);
   console.log("文字No"+letternumber);

   enemyName += source[letternumber];
   enemyHP += letternumber;
}
console.log("enemyname"+enemyName);
console.log("HP:"+enemyHP);


console.log("CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC");
//敵文字表示
$("#enemy").html(enemyName);

//先頭開始


//Player ダメージ関数定義
function playerAttack(){
   let i = Math.ceil(Math.random()*Math.random()*100)
   return i;
}

}   //playing文end


console.log("DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD");
//敵との判定
$("#attack").on("click",function(){
    let attack = playerAttack();
    enemyHP -= attack;
    $("#comment").html(attack+"ダメージを与えた"+"残り敵のHP"+enemyHP);
    if(enemyHP<=0){
      let savecheck = confirm("敵を倒した！！ ここまでを保存しますか？");
      
        enemyHP=0;
        let exp = 0;
        $("#comment").html(attack+"だめーじを与えた"+"残り敵のHP"+enemyHP);
        if(savecheck==1){
            let key = "敵の名前" ;
            localStorage.setItem(key,enemyName);
            loadData();
        }
    }
})


//履歴表示
function loadData (){
  $("#list").empty();
  for(let i =0; i<localStorage.length;i++){
     const key =localStorage.key(i);
     const memo = localStorage.getItem(key);
     $("#list").append('<tr><td>'+key+'</td><td>'+memo+'</td></tr>');
  }

    
}


//-----------------------------------------

//1.Save クリックイベント
$("#save").on("click",function(){
    const key = $("#key").val();
    const memo = $("#memo").val();
    localStorage.setItem(key,memo);
    const h = '<tr><td>'+key+'</td><td>'+memo+'</td></tr>'
    $("#list").append(h);
});






//2.clear クリックイベント
$("#clear").on("click",function(){
    localStorage.clear();
    $("#list").empty();
});

</script>
<footer><small>G's</small></footer>
</body>
</html>
